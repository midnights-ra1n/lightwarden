[package]
name = "lightwarden"
version = "0.2.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
argon2 = "0.5"
hkdf = "0.12"
directories = "5"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "ecdsa", "encryption", "getrandom", "std"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = "2"

[profile.release]
lto = true
strip = true
