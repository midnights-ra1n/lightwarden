[package]
name = "lightwarden"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
argon2 = "0.5"
hkdf = "0.12"
directories = "5"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "ecdsa", "p256", "p384", "p521", "encryption", "getrandom", "std"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
sys-locale = "0.3.2"
tokio = { version = "1", features = ["net", "io-util", "time"] }
rsa = "0.9"
signature = "2"
ssh-encoding = { version = "0.2", features = ["alloc"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"

[target."cfg(not(windows))".dependencies]
notify-rust = "4.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]
